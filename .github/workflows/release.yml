name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore .\SmtpHeaderAnalyzer.slnx
      - name: Build and test
        run: |
          dotnet build .\SmtpHeaderAnalyzer.slnx -c Release -m:1 -p:UseSharedCompilation=false --no-restore
          dotnet run --project .\tests\SmtpHeaderAnalyzer.Tests\SmtpHeaderAnalyzer.Tests.csproj -c Release --no-build
      - name: Publish Windows x64 executable
        run: dotnet publish .\src\SmtpHeaderAnalyzer\SmtpHeaderAnalyzer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true --no-restore -o .\dist
      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash .\dist\SmtpHeaderAnalyzer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  SmtpHeaderAnalyzer.exe" | Set-Content .\dist\SHA256SUMS.txt -Encoding ascii
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME .\dist\SmtpHeaderAnalyzer.exe .\dist\SHA256SUMS.txt --generate-notes --title "SMTP Header Analyzer $env:GITHUB_REF_NAME"
